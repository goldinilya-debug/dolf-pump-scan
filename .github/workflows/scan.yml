name: pump-scan
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scan, cancel-in-progress: false}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scan.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OPENMARKET_KEY: ${{ secrets.OPENMARKET_KEY }}
      - run: |
          git config user.name pumpbot; git config user.email pumpbot@users.noreply.github.com
          git add state.json; [ -f journal.csv ] && git add journal.csv || true
          git diff --cached --quiet || (git commit -m "state $(date -u +%F_%H%M)" && git push)
